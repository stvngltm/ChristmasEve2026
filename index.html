<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Presensi Jemaat GBI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Custom Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #reader { border: none !important; }
        #reader video { object-fit: cover !important; border-radius: 1rem; width: 100% !important; }
        #reader__scan_region { background: rgba(0, 0, 0, 0.05); border-radius: 1rem; }
        #reader__dashboard { padding: 0.5rem !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header Minimalis -->
    <header class="max-w-md w-full mx-auto text-center my-2">
        <div class="inline-flex items-center gap-2 bg-slate-800/80 border border-slate-700/80 px-4 py-2 rounded-full mb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Gate Presensi Online</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-white">Presensi Jemaat GBI</h1>
        <p class="text-xs text-slate-400 mt-1">Arahkan QR Code / Barcode Anggota ke Kamera</p>
    </header>

    <!-- Main Scanner Box -->
    <main class="max-w-md w-full mx-auto my-auto flex flex-col gap-4">
        
        <!-- Frame Kamera -->
        <div class="relative bg-slate-800 border border-slate-700/80 rounded-2xl p-3 shadow-2xl overflow-hidden">
            <div id="reader" class="w-full rounded-xl overflow-hidden min-h-[300px]"></div>

            <!-- Overlay Loading / Cooldown -->
            <div id="scanCooldownOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 z-20 transition-all">
                <div class="bg-indigo-600 p-4 rounded-full mb-3 animate-bounce shadow-lg shadow-indigo-500/50">
                    <i class="fa-solid fa-qrcode text-2xl text-white"></i>
                </div>
                <p id="cooldownText" class="font-bold text-base text-white">Memproses QR Code...</p>
                <span class="text-xs text-slate-400 mt-1">Verifikasi ke database Master Data</span>
            </div>
        </div>

        <!-- Kontrol Kamera -->
        <div class="flex items-center justify-between gap-3 bg-slate-800/60 border border-slate-700/60 p-3 rounded-xl">
            <button id="btnStartScan" onclick="startScanner()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-play"></i> Mulai Kamera
            </button>
            <button id="btnStopScan" onclick="stopScanner()" class="hidden flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-stop"></i> Matikan Kamera
            </button>
            
            <select id="cameraSelect" class="bg-slate-900 border border-slate-700 text-slate-300 rounded-lg text-xs p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Pilih Kamera...</option>
            </select>
        </div>

        <!-- Pop-up Modal Notifikasi "Selamat Datang" -->
        <div id="welcomeModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-emerald-500/30 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-100">
                <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl animate-pulse">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                
                <span id="modalBranchBadge" class="inline-block bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[11px] font-semibold px-3 py-1 rounded-full mb-2">
                    GBI Hasyim Ashari
                </span>
                
                <h3 class="text-xl sm:text-2xl font-extrabold text-white mb-2 leading-tight">
                    Selamat Datang,<br><span id="modalJemaatName" class="text-emerald-400">---</span>!
                </h3>
                
                <p class="text-sm font-medium text-slate-300 mt-2">
                    Selamat beribadah! 🙏✨
                </p>
                <p id="modalJemaatID" class="text-[11px] font-mono text-slate-500 mt-1">ID: ---</p>

                <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-center">
                    <span class="text-[11px] text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-spinner animate-spin text-emerald-400"></i> Siap untuk scan berikutnya...
                    </span>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Status Sync -->
    <footer class="max-w-md w-full mx-auto text-center mt-4">
        <div class="flex items-center justify-between text-[11px] text-slate-500 px-2">
            <span id="syncStatusText"><i class="fa-solid fa-arrows-rotate animate-spin mr-1"></i> Sync Master Data...</span>
            <button onclick="loadMasterData()" class="hover:text-slate-300 transition underline">Reload Master</button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Web App URL Apps Script Terbaru
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbY_zM5a-BFnd4LS9i0lQZX9k3fGlqN1QjLfajKj5gQ64bDwdFa-mYu-G1eX6fwaC/exec";

        let html5QrCode = null;
        let isScanning = false;
        let isCooldown = false;
        let masterJemaatDB = [];

        window.onload = function() {
            loadMasterData();
            initCameraList();
        };

        function playSuccessBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.1);

                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.2);
                }, 80);
            } catch (e) {}
        }

        function loadMasterData() {
            const statusEl = document.getElementById('syncStatusText');
            statusEl.innerHTML = `<i class="fa-solid fa-arrows-rotate animate-spin mr-1"></i> Sync Master Data...`;

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        masterJemaatDB = data;
                        statusEl.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-400 mr-1"></i> ${data.length} Master Jemaat Terhubung`;
                    } else {
                        statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-400 mr-1"></i> Master Data Kosong`;
                    }
                })
                .catch(err => {
                    console.error("Gagal sync master data:", err);
                    statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1"></i> Sync Offline`;
                });
        }

        async function initCameraList() {
            const cameraSelect = document.getElementById('cameraSelect');
            cameraSelect.innerHTML = '<option value="">Pilih Kamera...</option>';
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length > 0) {
                    devices.forEach((device, index) => {
                        const opt = document.createElement('option');
                        opt.value = device.id;
                        opt.text = device.label || `Kamera ${index + 1}`;
                        cameraSelect.appendChild(opt);
                    });
                    startScanner();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function startScanner() {
            if (isScanning) return;
            const selectedCameraId = document.getElementById('cameraSelect').value;
            const config = { fps: 12, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
            html5QrCode = new Html5Qrcode("reader");
            const cameraConfig = selectedCameraId ? { deviceId: { exact: selectedCameraId } } : { facingMode: "environment" };

            html5QrCode.start(cameraConfig, config, onScanSuccess, null).then(() => {
                isScanning = true;
                document.getElementById('btnStartScan').classList.add('hidden');
                document.getElementById('btnStopScan').classList.remove('hidden');
            }).catch(err => console.error(err));
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    isScanning = false;
                    document.getElementById('btnStartScan').classList.remove('hidden');
                    document.getElementById('btnStopScan').classList.add('hidden');
                });
            }
        }

        function onScanSuccess(decodedText) {
            if (isCooldown) return;
            isCooldown = true;

            const cleanNo = decodedText.trim().toUpperCase();
            
            // Match data dari master data
            const foundMaster = masterJemaatDB.find(m => m.noAnggota.toUpperCase() === cleanNo);
            const namaJemaat = foundMaster ? (foundMaster.nama || "Jemaat") : "Jemaat";
            const gbiCabang = foundMaster ? (foundMaster.gbi || "GBI Hasyim Ashari") : "GBI Hasyim Ashari";

            playSuccessBeep();
            showWelcomeModal(cleanNo, namaJemaat, gbiCabang);

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    waktu: `${dateStr} ${timeStr}`,
                    no_anggota: cleanNo,
                    nama: namaJemaat,
                    sektor: gbiCabang,
                    petugas: "Petugas Gate"
                })
            });

            setTimeout(() => {
                hideWelcomeModal();
                isCooldown = false;
            }, 3000);
        }

        function showWelcomeModal(id, nama, gbi) {
            document.getElementById('modalJemaatName').innerText = nama;
            document.getElementById('modalBranchBadge').innerText = gbi;
            document.getElementById('modalJemaatID').innerText = `ID: ${id}`;
            document.getElementById('welcomeModal').classList.remove('hidden');
        }

        function hideWelcomeModal() {
            document.getElementById('welcomeModal').classList.add('hidden');
        }
    </script>
</body>
</html>
