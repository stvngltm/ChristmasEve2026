<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Jemaat</title>
  <!-- Tailwind CSS untuk Tampilan Modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-6 text-center">
    <h1 class="text-xl font-bold text-slate-800 mb-1">Presensi QR Jemaat</h1>
    <p class="text-sm text-slate-500 mb-6">Arahkan kamera ke QR Code Anggota</p>

    <!-- Container Kamera / Scanner -->
    <div id="reader" class="rounded-xl overflow-hidden border-2 border-dashed border-slate-300 bg-slate-50"></div>

    <!-- Status Process & Alert -->
    <div id="status" class="mt-4 p-3 text-sm rounded-lg hidden font-medium"></div>

    <!-- Hasil Scan Terakhir -->
    <div id="result-box" class="mt-4 hidden p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-left">
      <div class="text-xs font-semibold uppercase tracking-wider text-emerald-600 mb-1">Presensi Berhasil</div>
      <div class="text-lg font-bold text-slate-800" id="res-nama">-</div>
      <div class="text-sm text-slate-600" id="res-no">-</div>
      <div class="text-xs text-slate-500 mt-1" id="res-gbi">-</div>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH DENGAN URL WEB APP DEPLOYMENT APPS SCRIPT ANDA
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
    
    let isProcessing = false;

    function showStatus(text, type) {
      const statusEl = document.getElementById("status");
      statusEl.classList.remove("hidden", "bg-yellow-100", "text-yellow-800", "bg-red-100", "text-red-800", "bg-blue-100", "text-blue-800");
      
      if (type === "loading") {
        statusEl.classList.add("bg-blue-100", "text-blue-800");
      } else if (type === "error") {
        statusEl.classList.add("bg-red-100", "text-red-800");
      } else if (type === "warning") {
        statusEl.classList.add("bg-yellow-100", "text-yellow-800");
      }
      
      statusEl.innerText = text;
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return; // Mencegah scan ganda bersamaan
      isProcessing = true;

      showStatus("Memverifikasi data: " + decodedText + "...", "loading");

      try {
        const payload = {
          no_anggota: decodedText.trim(),
          petugas: "Petugas Gate 1"
        };

        // Kirim HTTP POST ke Apps Script
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8" // Menghindari pre-flight CORS di Apps Script
          },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.result === "success") {
          showStatus("Berhasil Dicatat!", "loading");
          
          // Tampilkan Hasil
          document.getElementById("result-box").classList.remove("hidden");
          document.getElementById("res-nama").innerText = resData.nama;
          document.getElementById("res-no").innerText = "No: " + resData.no_anggota;
          document.getElementById("res-gbi").innerText = "Sektor/GBI: " + resData.gbi;

          document.getElementById("status").classList.add("hidden");
        } else {
          showStatus("Gagal: " + resData.message, "error");
        }
      } catch (err) {
        showStatus("Terjadi kesalahan jaringan/CORS", "error");
        console.error(err);
      }

      // Jeda 3 detik sebelum dapat melakukan scan QR berikutnya
      setTimeout(() => {
        isProcessing = false;
      }, 3000);
    }

    // Inisialisasi Scanner Kamera
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: { width: 250, height: 250 } 
    });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
